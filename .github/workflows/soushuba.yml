name: Run soushuba qiandao
on:
  workflow_dispatch:
  schedule:
    - cron: '17 21 * * *'

permissions:
  contents: read

concurrency:
  group: soushuba-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository code
        uses: actions/checkout@v3
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check script syntax
        run: python -m py_compile soushuba.py
      - name: Run daily forum task
        env:
          SOUSHUBA_HOSTNAME: ${{ secrets.SOUSHUBA_HOSTNAME }}
          SOUSHUBA_USERNAME: ${{ secrets.SOUSHUBA_USERNAME }}
          SOUSHUBA_PASSWORD: ${{ secrets.SOUSHUBA_PASSWORD }}
        run: python soushuba.py
